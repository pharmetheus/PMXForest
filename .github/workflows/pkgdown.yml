name: pkgdown

on:
  push:
    branches:
      - main
  pull_request:
  release:
    types:
      - published
  workflow_dispatch:

concurrency:
  group: pkgdown-${{ github.event.pull_request.number || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-pkgdown:
    if: endsWith(github.repository, '-private')

    strategy:
      fail-fast: false
      matrix:
        runs-on: 
          - self-hosted
        r-version:
          - '4.2.2'
    runs-on: ${{ matrix.runs-on }}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      LIB_Q: /opt/R/packages/4.2/qualified
      REPO_UNQ: https://rpkgs.pmx.one/r4.2-unqualified/latest
      REPO_Q: https://rpkgs.pmx.one/r4.2-qualified/latest

    steps:
      - name: Add path for R and TexLive
        if: ${{ matrix.runs-on == 'self-hosted' }}
        run: |
          echo "/opt/R/${{ matrix.r-version }}/bin" >> "$GITHUB_PATH"
          echo "/opt/el8/texlive/2025/bin/x86_64-linux" >> "$GITHUB_PATH"

      - name: Checkout repositories
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create ephemeral library
        if: ${{ matrix.runs-on == 'self-hosted' }}
        shell: bash
        run: |
          TEMP_LIB="$RUNNER_TEMP/Rlib-${GITHUB_RUN_ID}"
          mkdir -p "$TEMP_LIB"
          echo "R_LIBS_USER=$TEMP_LIB" >> "$GITHUB_ENV"

      - name: Install dependencies
        shell: Rscript --no-environ {0}
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          options(repos = c(
            unqualified = Sys.getenv("REPO_UNQ"),
            qualified   = Sys.getenv("REPO_Q")
          ))

          lib <- Sys.getenv("R_LIBS_USER")
          .libPaths(unique(c(lib, Sys.getenv("LIB_Q"), .libPaths())))

          if (!requireNamespace("remotes", quietly = TRUE)) {
            install.packages("remotes", lib = lib)
          }

          remotes::install_local(
            ".",
            dependencies = TRUE,
            lib = lib,
            upgrade = "never"
          )

          if (!requireNamespace("pkgdown", quietly = TRUE)) {
            install.packages("pkgdown", lib = lib)
          }

      - name: Build site
        shell: bash
        run: |
          export R_LIBS="${R_LIBS_USER}:${LIB_Q}:/opt/R/4.2.2/lib/R/library"
          Rscript -e "options(pkgdown.internet = FALSE); pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)"

      - name: Upload site artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: pkgdown-site
          path: docs/
          retention-days: 1

  deploy-pkgdown:
    needs: [ "build-pkgdown" ]
    runs-on: ubuntu-slim
    if: github.event_name != 'pull_request' && endsWith(github.repository, '-private')

    permissions:
      contents: write

    steps:
      - name: Checkout repositories
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download site artifact
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: pkgdown-site
          path: docs/

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
