name: pkgdown

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
  workflow_dispatch:

jobs:
  build-pkgdown:
    if: endsWith(github.repository, '-private')
    runs-on: self-hosted

    concurrency:
      group: pkgdown-build-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true

    outputs:
      package_name: ${{ steps.metadata.outputs.package_name }}
      package_version: ${{ steps.metadata.outputs.package_version }}

    env:
      R_VERSION: "4.2.2"
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      LIB_Q: /opt/R/packages/4.2/qualified
      REPO_UNQ: https://rpkgs.pmx.one/r4.2-unqualified/latest
      REPO_Q: https://rpkgs.pmx.one/r4.2-qualified/latest

    steps:
      - name: Add path for R and TexLive
        run: |
          echo "/opt/R/${R_VERSION}/bin" >> "$GITHUB_PATH"
          echo "/opt/el8/texlive/2025/bin/x86_64-linux" >> "$GITHUB_PATH"

      - name: Checkout repositories
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Extract package metadata
        id: metadata
        shell: Rscript --vanilla {0}
        run: |
          description <- read.dcf("DESCRIPTION", fields = c("Package", "Version"))

          package <- unname(description[1, "Package"])
          version <- unname(description[1, "Version"])

          output <- Sys.getenv("GITHUB_OUTPUT")
          cat("package_name=", package, "\n", sep = "", file = output, append = TRUE)
          cat("package_version=", version, "\n", sep = "", file = output, append = TRUE)

      - name: Create ephemeral library
        shell: bash
        run: |
          TEMP_LIB="$RUNNER_TEMP/Rlib-${GITHUB_RUN_ID}"
          mkdir -p "$TEMP_LIB"
          echo "R_LIBS_USER=$TEMP_LIB" >> "$GITHUB_ENV"

      - name: Install dependencies
        shell: Rscript --no-environ {0}
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          options(repos = c(
            unqualified = Sys.getenv("REPO_UNQ"),
            qualified   = Sys.getenv("REPO_Q")
          ))

          lib <- Sys.getenv("R_LIBS_USER")
          .libPaths(unique(c(lib, Sys.getenv("LIB_Q"), .libPaths())))

          if (!requireNamespace("remotes", quietly = TRUE)) {
            install.packages("remotes", lib = lib)
          }

          remotes::install_local(
            ".",
            dependencies = TRUE,
            lib = lib,
            upgrade = "never"
          )

          if (!requireNamespace("pkgdown", quietly = TRUE)) {
            install.packages("pkgdown", lib = lib)
          }

      - name: Build site
        shell: bash
        run: |
          export R_LIBS="${R_LIBS_USER}:${LIB_Q}:/opt/R/4.2.2/lib/R/library"
          Rscript -e "options(pkgdown.internet = FALSE); pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)"

      - name: Upload site artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: pkgdown-site-${{ github.run_id }}-${{ github.run_attempt }}
          path: docs/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  deploy-github-pages:
    needs: [ "build-pkgdown" ]
    runs-on: ubuntu-slim
    if: github.event_name != 'pull_request' && endsWith(github.repository, '-private')

    permissions:
      contents: write

    steps:
      - name: Checkout repositories
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download site artifact
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: pkgdown-site-${{ github.run_id }}-${{ github.run_attempt }}
          path: docs/

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          clean: false
          branch: gh-pages
          folder: docs

  deploy-internal-pkgdown:
    if: >-
      ( endsWith(github.repository, '-private') && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'publish-to-dev') ||
      github.event_name == 'workflow_dispatch'))
    needs: build-pkgdown
    runs-on: self-hosted
    timeout-minutes: 20

    concurrency:
      group: pkgdown-deploy-${{ github.repository }}
      cancel-in-progress: false

    env:
      PACKAGE_NAME: ${{ needs.build-pkgdown.outputs.package_name }}
      PACKAGE_VERSION: ${{ needs.build-pkgdown.outputs.package_version }}
      SSH_HOST: ${{ vars.PKGDOWN_SSH_HOST }}
      SSH_PORT: ${{ vars.PKGDOWN_SSH_PORT }}
      SSH_USER: ${{ vars.PKGDOWN_SSH_USER }}
      PKGDOWN_INDEX_FILE: docs_index/index.html

    steps:
      - name: Download pkgdown site
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: pkgdown-site-${{ github.run_id }}-${{ github.run_attempt }}
          path: docs/

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PKGDOWN_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077

          ssh_dir=$(mktemp -d "${RUNNER_TEMP}/pkgdown-ssh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-XXXXXX")
          key_path="${ssh_dir}/deploy_key"
          known_hosts_path="${ssh_dir}/known_hosts"

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_path"
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" > "$known_hosts_path"
          chmod 0600 "$key_path" "$known_hosts_path"

          echo "PKGDOWN_SSH_DIR=$ssh_dir" >> "$GITHUB_ENV"
          echo "PKGDOWN_SSH_KEY=$key_path" >> "$GITHUB_ENV"
          echo "PKGDOWN_KNOWN_HOSTS=$known_hosts_path" >> "$GITHUB_ENV"

      - name: Validate release tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail

          expected_tag="v${PACKAGE_VERSION}"

          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Release tag '$GITHUB_REF_NAME' does not match DESCRIPTION version '$PACKAGE_VERSION'." >&2
            exit 1
          fi

      - name: Deploy to Internal Nginx 🚀
        shell: bash
        run: |
          set -euo pipefail

          ssh_command="ssh -i ${PKGDOWN_SSH_KEY} -p ${SSH_PORT} -o StrictHostKeyChecking=yes -o UserKnownHostsFile=${PKGDOWN_KNOWN_HOSTS}"
          remote_version="${SSH_USER}@${SSH_HOST}:/v${PACKAGE_VERSION}/"

          rsync -avz --delete -e "$ssh_command" docs/ "$remote_version"

      - name: Generate versions index
        shell: bash
        run: |
          set -euo pipefail

          ssh_command="ssh -i ${PKGDOWN_SSH_KEY} -p ${SSH_PORT} -o StrictHostKeyChecking=yes -o UserKnownHostsFile=${PKGDOWN_KNOWN_HOSTS}"
          remote_root="${SSH_USER}@${SSH_HOST}:/"

          REMOTE_VERSIONS=$(rsync --list-only -e "$ssh_command" "$remote_root" | awk '{print $NF}' | grep '^v' | sort -rV)

          mkdir -p "$(dirname "$PKGDOWN_INDEX_FILE")"

          cat <<EOF > "$PKGDOWN_INDEX_FILE"
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>${PACKAGE_NAME} Versions</title>
            <link rel="stylesheet" href="/pmx.css">
          </head>
          <body>
            <header class="brand-header">
              <a href="/"><img src="/pmx.png" alt="Pharmetheus Logo" class="brand-logo"></a>
            </header>
            <main class="container">
              <div style="margin-bottom: 20px;">
                <a href="/" style="text-decoration: none; font-weight: bold;">&larr; Back to All Packages</a>
              </div>
              <h1>${PACKAGE_NAME} Documentation Versions</h1>
              <ul class="repo-list">
          EOF

          for version in $REMOTE_VERSIONS; do
            echo "<li><a href=\"$version/\">$version</a></li>" >> "$PKGDOWN_INDEX_FILE"
          done

          cat << 'EOF' >> "$PKGDOWN_INDEX_FILE"
          </ul></main></body></html>
          EOF

      - name: Publish versions index
        shell: bash
        run: |
          set -euo pipefail

          ssh_command="ssh -i ${PKGDOWN_SSH_KEY} -p ${SSH_PORT} -o StrictHostKeyChecking=yes -o UserKnownHostsFile=${PKGDOWN_KNOWN_HOSTS}"
          remote_root="${SSH_USER}@${SSH_HOST}:/"

          rsync -avz -e "$ssh_command" "$PKGDOWN_INDEX_FILE" "$remote_root"
